<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AetherAI Explorer - Intelligent Search & Knowledge Portal</title>
  <meta name="description" content="AetherAI Explorer is an intelligent AI search assistant and knowledge portal.">
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body class="dark-theme">
  <!-- 0. STEALTH SECURITY GATE (Fake AI Search Portal Mask) -->
  <div id="security-mask-gate" class="security-mask-gate light-theme">
    <!-- Header -->
    <header class="agent-header">
      <button type="button" class="header-action-btn btn-theme" id="agent-theme-toggle" title="Toggle Theme">
        <svg id="agent-theme-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-.39-1.03 0-1.41s1.03-.39 1.41 0l1.06 1.06c.39.39.39 1.03 0 1.41s-1.03.39-1.41 0l-1.06-1.06zm-12.37 12.37c-.39-.39-.39-1.03 0-1.41s1.03-.39 1.41 0l1.06 1.06c.39.39.39 1.03 0 1.41s-1.03.39-1.41 0l-1.06-1.06z"/>
        </svg>
      </button>
    </header>

    <!-- Main Workspace -->
    <main class="agent-workspace">
      <!-- Chat history thread -->
      <div id="agent-chat-history" class="agent-chat-history">
        <!-- Welcome Screen inside chat workspace -->
        <div id="agent-welcome-screen" class="agent-welcome-screen">
          <svg class="agent-centered-logo" viewBox="0 0 100 100" width="60" height="60" fill="currentColor">
            <polygon points="35,75 55,25 70,25 50,75"/>
            <polygon points="50,75 62,45 74,45 62,75" opacity="0.8"/>
          </svg>
          <h1 class="serif-title">Good Morning, Explorer</h1>
        </div>
      </div>

      <!-- Input Bar Console -->
      <div class="agent-input-console">
        <div class="console-search-bar">
          <input type="text" id="ai-search-input" placeholder="How can I help you today?" autocomplete="off">
          <div id="console-img-preview-container" class="console-img-preview-container hidden">
            <div class="console-img-preview-wrapper">
              <img id="console-img-preview" src="" alt="Preview">
              <button type="button" id="console-img-remove-btn" class="console-img-remove-btn">&times;</button>
            </div>
          </div>
          
          <input type="file" id="console-file-input" accept="image/*" style="display: none;">

          <div class="console-controls-row">
            <button type="button" class="console-control-btn btn-plus" title="Add source">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
            </button>
            
            <div class="right-buttons-group">
              <button type="button" class="console-control-btn btn-mic" title="Voice Input">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.34 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
              </button>
              
              <button type="button" id="ai-search-btn" class="btn-speaker" title="Send message">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Main Script -->
  <script src="app.js?v=21" defer></script>
</body>
</html>
